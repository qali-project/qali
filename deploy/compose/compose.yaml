# Production deployment (docs/SECURITY_ARCHITECTURE.md sections 3, 10, 11).
# Only the reverse proxy publishes a host port: 443/tcp. Qali and PostgreSQL sit
# on internal networks. Secrets are mounted files, never environment values.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then edit
#   docker compose -f deploy/compose/compose.yaml --env-file deploy/compose/.env up -d
#
# `make build` verifies this file with tools/deploycheck.
name: qali

services:
  proxy:
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    restart: unless-stopped
    depends_on: [qali]
    ports:
      - target: 443
        published: "${QALI_HTTPS_PORT:-443}"
        protocol: tcp
        mode: ingress
    environment:
      QALI_DOMAIN: ${QALI_DOMAIN:?set QALI_DOMAIN}
      # "internal" uses Caddy's local CA; set an email address to obtain a
      # public certificate through the TLS-ALPN challenge on port 443.
      QALI_TLS: ${QALI_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m

  qali:
    image: ${QALI_IMAGE:-qali:dev}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    user: "65532:65532"
    environment:
      QALI_ENV: production
      QALI_PUBLIC_URL: https://${QALI_DOMAIN:?set QALI_DOMAIN}
      QALI_HTTP_ADDR: ":8080"
      QALI_TRUSTED_PROXIES: 172.31.250.0/28
      QALI_DATABASE_URL_FILE: /run/secrets/database_url
      QALI_KEK_FILE: /run/secrets/kek
      QALI_TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      QALI_PASSWORD_PEPPER_FILE: /run/secrets/password_pepper
    secrets: [database_url, kek, token_pepper, password_pepper]
    networks: [app, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/usr/local/bin/qali", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations with the migration role, then exits. Only this
  # container ever holds the migration credential.
  migrate:
    image: ${QALI_IMAGE:-qali:dev}
    command: ["migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    user: "65532:65532"
    environment:
      QALI_MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [migration_database_url]
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    # Run directly as the image's postgres user (uid 70) so no capabilities are
    # needed; the named volume inherits that ownership from the image.
    user: "70:70"
    environment:
      # Superuser for first-start bootstrap only; Qali connects as qali_migrator
      # or qali_app (deploy/postgres/initdb/10-qali-roles.sh).
      POSTGRES_USER: qali_admin
      POSTGRES_DB: qali
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, migrator_password, app_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/initdb/10-qali-roles.sh:/docker-entrypoint-initdb.d/10-qali-roles.sh:ro
      - ../postgres/sql/qali-database.sql:/opt/qali/qali-database.sql:ro
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70
      - /var/run/postgresql:uid=70,gid=70
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "qali_admin", "-d", "qali"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge: {}
  app:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/28
  data:
    internal: true

secrets:
  database_url:
    file: ${QALI_SECRETS_DIR:-./secrets}/database_url
  kek:
    file: ${QALI_SECRETS_DIR:-./secrets}/kek
  token_pepper:
    file: ${QALI_SECRETS_DIR:-./secrets}/token_pepper
  password_pepper:
    file: ${QALI_SECRETS_DIR:-./secrets}/password_pepper
  migration_database_url:
    file: ${QALI_SECRETS_DIR:-./secrets}/migration_database_url
  postgres_password:
    file: ${QALI_SECRETS_DIR:-./secrets}/postgres_password
  migrator_password:
    file: ${QALI_SECRETS_DIR:-./secrets}/migrator_password
  app_password:
    file: ${QALI_SECRETS_DIR:-./secrets}/app_password

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
