# Typed SQL (AGENTS.md). The schema is read from the goose migrations.
# Regenerate with `make generate`; `make fmt-check` rejects stale output.
version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      - db_type: inet
        go_type: net/netip.Addr
      - db_type: inet
        nullable: true
        go_type:
          import: net/netip
          type: Addr
          pointer: true
sql:
  - engine: postgresql
    schema: [tools/sqlc/schema.sql, migrations]
    queries: internal/platform/audit/queries.sql
    gen:
      go:
        package: auditdb
        out: internal/platform/audit/auditdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: [tools/sqlc/schema.sql, migrations]
    queries: internal/platform/jobs/queries.sql
    gen:
      go:
        package: jobsdb
        out: internal/platform/jobs/jobsdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: [tools/sqlc/schema.sql, migrations]
    queries: internal/identity/adapter/postgres/queries.sql
    gen:
      go:
        package: iddb
        out: internal/identity/adapter/postgres/iddb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: [tools/sqlc/schema.sql, migrations]
    queries: internal/workspace/adapter/postgres/queries.sql
    gen:
      go:
        package: wsdb
        out: internal/workspace/adapter/postgres/wsdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
