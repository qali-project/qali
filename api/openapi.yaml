openapi: 3.1.0
info:
  title: Qali API
  version: 0.1.0
  description: >-
    Public HTTP API of Qali. Conventions are defined in ADR-0003
    (docs/adr/0003-http-api-url-and-versioning-conventions.md).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
# Every operation requires an active session unless it declares
# `security: []`. Operations usable before MFA completes list the allowed
# session states in x-qali-session-states (ADR-0012). Unsafe requests with a
# session also need the X-CSRF-Token header.
security:
  - sessionCookie: []
tags:
  - name: health
    description: Private probes. Public output is a boolean status only.
  - name: setup
    description: First-owner bootstrap; available only until it completes.
  - name: auth
    description: Local authentication, MFA, sessions, and recovery.
  - name: workspaces
    description: Workspaces the caller belongs to, and their members.
  - name: invitations
    description: One-time invitation links and their acceptance.
  - name: projects
    description: Projects as access objects and their direct members.
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness probe
      description: Reports that the process is running. Contains no dependency details.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
        default:
          $ref: "#/components/responses/Problem"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe
      description: >-
        Reports whether the instance can serve traffic: the database is
        reachable and the schema matches this release. Reasons are logged,
        never returned.
      security: []
      responses:
        "200":
          description: The instance is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: The instance is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Whether first-owner bootstrap is still required
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/setup/owner:
    post:
      operationId: bootstrapOwner
      tags: [setup]
      summary: Create the first owner, workspace, and session
      description: >-
        Requires a one-time setup token issued on the server, so a remote
        caller cannot claim a fresh installation. A missing or invalid token
        answers 403 setup_token_invalid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: Bootstrap completed; a session cookie is set and MFA enrollment is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Password accepted; the session may still require MFA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: The current session, including its CSRF token
      x-qali-session-states: [mfa_enrollment, mfa_challenge, active]
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/challenge:
    post:
      operationId: completeMfaChallenge
      tags: [auth]
      summary: Complete sign-in with a TOTP code
      x-qali-session-states: [mfa_challenge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "200":
          description: The session is active and was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/totp/enrollment:
    post:
      operationId: beginTotpEnrollment
      tags: [auth]
      summary: Start TOTP enrollment and return the secret once
      x-qali-session-states: [mfa_enrollment, active]
      responses:
        "200":
          description: A new, unconfirmed TOTP secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/totp/enrollment/confirm:
    post:
      operationId: confirmTotpEnrollment
      tags: [auth]
      summary: Confirm TOTP enrollment and receive recovery codes once
      x-qali-session-states: [mfa_enrollment, active]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "200":
          description: TOTP is enabled; the session is active and was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [auth]
      summary: Replace all recovery codes; requires a current TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "200":
          description: New recovery codes, shown once. Previous codes stop working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password; revokes all other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "200":
          description: Password changed; the current session was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      x-qali-session-states: [mfa_enrollment, mfa_challenge, active]
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags: [auth]
      summary: End every session of the current user
      responses:
        "204":
          description: All sessions revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/recovery:
    post:
      operationId: recoverAccount
      tags: [auth]
      summary: Set a new password with a single-use recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "204":
          description: Password reset; all sessions were revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/password-reset:
    post:
      operationId: redeemPasswordReset
      tags: [auth]
      summary: Set a new password with an operator-issued reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Password reset; all sessions were revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/step-up:
    post:
      operationId: stepUpMfa
      tags: [auth]
      summary: Re-authenticate with a TOTP code before a sensitive action
      description: >-
        Records recent strong authentication (valid for 10 minutes) and
        rotates the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "200":
          description: Recent MFA recorded; the session was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/invitations/preview:
    post:
      operationId: previewInvitation
      tags: [invitations]
      summary: Describe a pending invitation from its one-time token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationToken"
      responses:
        "200":
          description: The invitation is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitationNewAccount
      tags: [invitations]
      summary: Accept an invitation by creating an account for its email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptNew"
      responses:
        "201":
          description: Account and membership created; a session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/invitations/accept-existing:
    post:
      operationId: acceptInvitationExistingAccount
      tags: [invitations]
      summary: Accept an invitation with the signed-in account
      description: The session's email must match the invitation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationToken"
      responses:
        "200":
          description: Membership created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: Workspaces where the caller is an active member
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: One workspace with the caller's role and permissions
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listMembers
      tags: [workspaces]
      summary: Workspace members
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Members ordered by user ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateMember
      tags: [workspaces]
      summary: Change a member's role or status
      description: >-
        Role changes need members.update_role and recent MFA; status changes
        need members.deactivate. Only an Owner may grant or change the owner
        role, and the last active Owner cannot be demoted or deactivated.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPatch"
      responses:
        "200":
          description: The updated member.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: Pending invitations (tokens are never returned again)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Pending, unexpired invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite an email address; the one-time token is shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: Invitation created. Earlier pending invitations for the same email are revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/{workspaceId}/invitations/{invitationId}/revoke:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke a pending invitation
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/{workspaceId}/projects:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listProjects
      tags: [projects]
      summary: Projects visible to the caller
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Visible projects ordered by ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: The project.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [projects]
      summary: One project with the caller's permissions on it
      responses:
        "200":
          description: The project.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMembers
      tags: [projects]
      summary: Direct project members
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Direct members ordered by user ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addProjectMember
      tags: [projects]
      summary: Add a workspace member to the project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberAdd"
      responses:
        "201":
          description: The direct membership.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateProjectMember
      tags: [projects]
      summary: Change a direct member's access level
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberPatch"
      responses:
        "200":
          description: The updated membership.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: Remove a direct project member
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-qali_session
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's nextCursor.
      schema:
        type: string
        maxLength: 512
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        The ETag ("<version>") of the representation being changed. Missing
        answers 428; stale answers 412 (ADR-0003).
      schema:
        type: string
        maxLength: 32
  headers:
    ETag:
      description: Quoted resource version (ADR-0003).
      schema:
        type: string
  responses:
    Problem:
      description: Error response (RFC 9457 problem details, ADR-0003).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    WorkspaceRole:
      type: string
      enum: [owner, workspace_admin, qa_lead, tester, viewer]
    InvitableRole:
      type: string
      description: Any role except owner (ownership is never granted by invitation).
      enum: [workspace_admin, qa_lead, tester, viewer]
    MemberStatus:
      type: string
      enum: [active, deactivated]
    ProjectVisibility:
      type: string
      enum: [public, restricted]
    ProjectAccessLevel:
      type: string
      enum: [contributor, viewer]
    Permissions:
      type: array
      description: >-
        Catalog permission IDs the caller holds here, for hiding controls.
        The server still checks every request; sensitive permissions may also
        need recent MFA.
      items:
        type: string
    NextCursor:
      type: [string, "null"]
      description: Cursor for the next page; null on the last page.
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        permissions:
          $ref: "#/components/schemas/Permissions"
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    Member:
      type: object
      additionalProperties: false
      required: [userId, email, displayName, role, status, version, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    MemberList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    MemberPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/InvitableRole"
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, invitedBy, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/InvitableRole"
        invitedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    InvitationCreated:
      type: object
      additionalProperties: false
      required: [invitation, token]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        token:
          type: string
          description: One-time qali_inv_ token for out-of-band delivery; shown once.
    InvitationList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    InvitationToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [workspaceName, email, role, expiresAt]
      properties:
        workspaceName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/InvitableRole"
        expiresAt:
          type: string
          format: date-time
    InvitationAcceptNew:
      type: object
      additionalProperties: false
      required: [token, displayName, password]
      properties:
        token:
          type: string
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [code, name, visibility]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        visibility:
          $ref: "#/components/schemas/ProjectVisibility"
    Project:
      type: object
      additionalProperties: false
      required: [id, code, name, visibility, version, createdAt, permissions]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        visibility:
          $ref: "#/components/schemas/ProjectVisibility"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        permissions:
          $ref: "#/components/schemas/Permissions"
    ProjectList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    ProjectMember:
      type: object
      additionalProperties: false
      required: [userId, email, displayName, level, version]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        level:
          $ref: "#/components/schemas/ProjectAccessLevel"
        version:
          type: integer
          minimum: 1
    ProjectMemberList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    ProjectMemberAdd:
      type: object
      additionalProperties: false
      required: [userId, level]
      properties:
        userId:
          type: string
          format: uuid
        level:
          $ref: "#/components/schemas/ProjectAccessLevel"
    ProjectMemberPatch:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level:
          $ref: "#/components/schemas/ProjectAccessLevel"
    SetupStatus:
      type: object
      additionalProperties: false
      required: [bootstrapRequired]
      properties:
        bootstrapRequired:
          type: boolean
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, password, workspaceName, setupToken]
      properties:
        setupToken:
          type: string
          maxLength: 128
          description: >-
            One-time qali_setup_ token printed by `qali setup-token` on the
            server; proves the caller operates the installation.
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
        workspaceName:
          type: string
          minLength: 1
          maxLength: 120
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 256
    TotpCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
    PasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          maxLength: 256
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 256
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [email, recoveryCode, newPassword]
      properties:
        email:
          type: string
          maxLength: 254
        recoveryCode:
          type: string
          maxLength: 32
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 256
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          maxLength: 128
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 256
    SessionState:
      type: string
      enum: [mfa_enrollment, mfa_challenge, active]
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, mfaEnrolled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        mfaEnrolled:
          type: boolean
    Session:
      type: object
      additionalProperties: false
      required: [user, state, csrfToken, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        state:
          $ref: "#/components/schemas/SessionState"
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry; shown once.
        otpauthUri:
          type: string
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    EnrollmentResult:
      type: object
      additionalProperties: false
      required: [session, recoveryCodes]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    Problem:
      description: RFC 9457 problem details with Qali extensions (ADR-0003).
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemFieldError"
    ProblemFieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer:
          type: string
        code:
          type: string
        message:
          type: string
