# Update policy: docs/DEPENDENCIES.md. New releases wait 14 days (cooldown)
# before an update is proposed; security updates are not delayed.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Major frontend upgrades are coordinated with the supported toolchain.
      # Dependabot security updates are not suppressed by update-types.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Keep runtime images on the documented Node and Go release lines.
      # Minor/major migrations also require CI and platform-doc updates.
      - dependency-name: node
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
